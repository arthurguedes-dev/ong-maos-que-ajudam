<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <title>Cadastro - ONG Mãos que Ajudam</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <header>

        <h1>Cadastro de Voluntários</h1>
        <p>Preencha seus dados para participar da ONG.</p>

        <nav class="navegacao">


        <!-- checkbox de abrir as opções do menu. -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <!-- botão visual hambúrguer -->    
            <label for="menu-toggle" class="menu-icon">☰</label>

            <ul class="menu">

                <li>
                    <a href="index.html">Início</a>
                </li>

                <li class="menu-dropdown">

                    <a href="projetos.html">Projetos</a>

                    <ul class="submenu">

                        <li>
                            <a href="projetos.html#alimentos">Campanha de Alimentos</a>
                        </li>

                        <li>
                            <a href="projetos.html#inclusao">Inclusão Digital</a>
                        </li>

                    </ul>
                
                </li>
                
                <li>
                    <a href="cadastro.html">Seja voluntário</a>
                </li>

            </ul>
 
        </nav>

    </header>

    <main id="conteudo">

        <form id="form-cadastro">

            <fieldset>

                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="data">Data de nascimento:</label>
                <input type="date" id="data" name="data" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
                        

            </fieldset>

            <fieldset>

                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required
                        pattern="[0-9]{5}-[0-9]{3}">

                <label for="rua">Rua:</label>
                <input type="text" id="rua" name="rua" required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required>
                    <option value="">Selecione um estado</option>
                    <option value="PB">Paraíba</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>

                </select>

            </fieldset>
  
            <button type="submit">Concluir cadastro</button>

                <div class="toast" role="status" aria-live="polite">
                Cadastro enviado com sucesso!
                </div>

        </form>

    </main>

<script type="module" src="../js/app.js"></script>

</body>


</html>
